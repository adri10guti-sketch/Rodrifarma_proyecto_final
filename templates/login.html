{% extends "base.html" %}
{% block contenido %}
<div class="card" style="max-width:420px;margin:auto">
  <h1>Iniciar sesión</h1>
  <form method="post" class="fila" style="flex-direction:column;align-items:stretch">
    <label>Nombre<input name="nombre" required></label>
    <label>Rol<select name="rol"><option>administradora</option><option>asistente</option></select></label>
    <label>Contraseña<input name="password" type="password" required></label>
    <button>Ingresar</button>
  </form>
  <p>¿Aún no tienes cuenta? <a href="{{ url_for('registro') }}">Registrarme</a></p>
</div>
{% endblock %}
