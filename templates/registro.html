{% extends "base.html" %}
{% block contenido %}
<div class="card" style="max-width:420px;margin:auto">
  <h1>Registro</h1>
  <p>Nombre: 4 a 12 letras minúsculas (a-z), sin espacios ni números.<br>
     Contraseña: 6 caracteres, con 1 a 4 letras. Ej.: <b>ab1234</b></p>
  <form method="post" class="fila" style="flex-direction:column;align-items:stretch">
    <label>Nombre<input name="nombre" required></label>
    <label>Rol<select name="rol"><option>asistente</option><option>administradora</option></select></label>
    <label>Contraseña<input name="password" type="password" required></label>
    <button>Registrarme</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
</div>
{% endblock %}
